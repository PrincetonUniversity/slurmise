name: Test snakemake integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smk-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - snakemake-version: v7
            python-version: "3.11"
          - snakemake-version: v8
            python-version: "3.12"
          - snakemake-version: v9
            python-version: "3.13"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Run snakemake ${{ matrix.snakemake-version }} tests
        run: uv run poe smk-test-${{ matrix.snakemake-version }}
