name: Test slurmise

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group dev --group docs

      - name: Run linter
        run: uv run poe fmt-check

      - name: Run tests
        run: |
          uv run poe test

      - name: Walk the tutorial with no scheduler
        run: |
          uv run tutorial/tutorial.py --yes --mock
          uv run tutorial/tutorial.py clean

      - name: Build documentation
        run: uv run poe docs

      - name: Upload coverage report
        run: uv run coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
