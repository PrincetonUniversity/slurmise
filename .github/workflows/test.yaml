name: Test slurmise

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group dev --group docs

      - name: Run tests
        run: |
          uv run poe test

      - name: Walk the tutorial with no scheduler
        # Every block that submits a job offers a `mock` option that declares
        # what the job would have used instead of running it. Proves the lessons'
        # logic and their `#>` expectations on every push; the real srun/sacct
        # path is covered by the tutorial-slurm workflow, which needs a cluster.
        # `uv run` puts the project venv on PATH, which is where the bare
        # `slurmise` the lessons call resolves from.
        run: |
          uv run tutorial/tutorial.py --yes --mock

      - name: Clean up after the walk
        # The walk leaves a database, fits and job logs in every lesson. They
        # are all gitignored, so `--ignored` is what proves `clean` found them
        # -- and that the tree still matches what the release tarball ships.
        run: |
          uv run tutorial/tutorial.py clean
          test -z "$(git status --porcelain --ignored tutorial)" || {
            git status --porcelain --ignored tutorial
            echo "::error::tutorial/ still has artifacts after \`tutorial.py clean\`"
            exit 1
          }

      - name: Run linter
        run: uv run poe fmt-check

      - name: Build documentation
        run: uv run poe docs

      - name: Upload coverage report
        run: uv run coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
