name: Test slurmise

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Run tests
        run: |
          uv run poe test

      - name: Run linter
        run: uv run poe fmt-check

      # Building the book executes every tutorial lesson and checks its output, so
      # this is the tutorial's integration test. It replaces the `tutorial.py --yes
      # --mock` walk, which went away with the script. A lesson whose command fails,
      # or whose output stops matching what the prose claims, fails this step.
      - name: Build the docs, executing the tutorial lessons
        run: uv run poe docs

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        run: uv run coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
