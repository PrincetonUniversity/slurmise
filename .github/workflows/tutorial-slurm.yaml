name: Tutorial SLURM integration

on:
  # TEMPORARY: run on pushes to fix/docs to validate this workflow
  push:
    branches: [fix/docs]
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC on the 1st of each month
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  tutorial-slurm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # koesterlab/setup-slurm-action wires slurmdbd accounting to MySQL on
    # 127.0.0.1:8888, which `slurmise record` needs (`sacct -j <id> --json`).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "8888:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install slurmise
        run: uv sync --python 3.12

      # Single-node cluster with slurmdbd accounting
      - name: Set up SLURM
        uses: koesterlab/setup-slurm-action@v1
        with:
          memory: 12000
          # cpus must be <= 2. GHA quir
          cpus: 2

      # The action does NOT set JobAcctGatherType (defaults to
      # jobacct_gather/none -> MaxRSS is never collected). Enable per-task
      # gathering at 1 s so the tutorial's short jobs (2-19 s) are sampled, then
      # restart the daemons so the change takes effect.
      - name: Enable memory accounting
        run: |
          set -euo pipefail
          conf="$(scontrol show config | awk '/^SLURM_CONF/{print $3}')"
          conf="${conf:-/etc/slurm/slurm.conf}"
          echo "patching $conf"
          sudo sed -i '/^JobAcctGatherType=/d;/^JobAcctGatherFrequency=/d' "$conf"
          printf 'JobAcctGatherType=jobacct_gather/linux\nJobAcctGatherFrequency=task=1\n' \
            | sudo tee -a "$conf"
          sudo systemctl restart slurmdbd slurmctld slurmd
          sleep 5

      - name: Show SLURM config (debug)
        run: |
          sinfo || true
          scontrol show config | grep -iE 'jobacctgather|accountingstorage' || true

      # The tour's failure and self-heal lessons need `--mem` to actually be
      # enforced. The action leaves memory advisory: a job can exceed its
      # allocation and still COMPLETE, so OUT_OF_MEMORY never happens and those
      # lessons wait forever. That needs memory to be a consumable resource AND
      # the cgroup task plugin to constrain it.
      #
      # Runs before the integration test so the part we are least sure of
      # reports first. The cost of that ordering: if this config breaks slurmd,
      # the integration test below fails too -- hence continue-on-error here and
      # a probe that checks the cluster still works before the tour runs.
      - name: Enforce memory limits
        continue-on-error: true
        run: |
          set -euo pipefail
          conf="$(scontrol show config | awk '/^SLURM_CONF/{print $3}')"
          conf="${conf:-/etc/slurm/slurm.conf}"
          echo "--- before ---"
          scontrol show config | grep -iE '^(SelectType|TaskPlugin|ProctrackType)' || true
          sudo sed -i '/^SelectTypeParameters=/d;/^TaskPlugin=/d;/^ProctrackType=/d' "$conf"
          printf 'SelectTypeParameters=CR_Core_Memory\nTaskPlugin=task/cgroup\nProctrackType=proctrack/cgroup\n' \
            | sudo tee -a "$conf"
          printf 'ConstrainRAMSpace=yes\nConstrainSwapSpace=yes\nAllowedRAMSpace=100\n' \
            | sudo tee "$(dirname "$conf")/cgroup.conf"
          sudo systemctl restart slurmdbd slurmctld slurmd || true
          sleep 8
          echo "--- after ---"
          scontrol show config | grep -iE '^(SelectType|TaskPlugin|ProctrackType)' || true
          sinfo || true

      # Ask the cluster rather than assume the patch took: run a job that wants
      # 4x its allocation and see whether SLURM kills it. The answer picks the
      # mode below, so a cgroup setup that does not work on this runner degrades
      # to --mock instead of waiting 45 minutes for an OOM that cannot happen.
      - name: Probe memory enforcement
        id: memcheck
        run: |
          set -euo pipefail
          jid="$(sbatch --parsable --mem=500M --time=00:03:00 \
            --wrap "$PWD/src/slurmise/tutorial/bin/perfectScaler --intensity 2000 --duration 3")"
          echo "probe job $jid: 500M allocation, wants ~2000M"
          for _ in $(seq 60); do
            squeue -j "$jid" -h 2>/dev/null | grep -q . || break
            sleep 5
          done
          sleep 5
          state="$(sacct -j "$jid" -X -n --format=State%20 | head -1 | tr -d ' ')"
          sacct -j "$jid" --format=JobID,State%16,ReqMem,MaxRSS,Elapsed || true
          if [ "$state" = "OUT_OF_MEMORY" ]; then
            echo "enforced=true" >> "$GITHUB_OUTPUT"
            echo "--mem is enforced; the tour will submit real jobs."
          else
            echo "enforced=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SLURM is not enforcing --mem (probe came back ${state:-<none>}, wanted OUT_OF_MEMORY). Running the tour with --mock, so the failure and self-heal lessons are simulated rather than scheduled."
          fi

      # The slurmise_run proposal is work in progress and kept out
      # of the run_tutorial_slurm.sh for now
      - name: Run slurmise_run tour
        working-directory: src/slurmise/tutorial/slurmise_run
        run: |
          if [ "${{ steps.memcheck.outputs.enforced }}" = "true" ]; then
            uv run --script ./tutorial.py --yes
          else
            uv run --script ./tutorial.py --yes --mock
          fi

      - name: Run tutorial integration
        env:
          RUN_ACCT_PROBE: "1"
          EXAMPLES: "01 02-perfect"
          WORK: ${{ github.workspace }}/tutorial-run
        run: ./tests/integration/run_tutorial_slurm.sh

      # Upload the generated tutorial tree (per-example slurmise.h5, fits, and
      # SLURM job logs) for manual inspection. `always()` so it is captured even
      # when an earlier step fails.
      - name: Upload tutorial run
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tutorial-run
          path: ${{ github.workspace }}/tutorial-run
          if-no-files-found: warn
