name: Release slurmise

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build --python ${{ matrix.python-version }}

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The getting-started tutorial ships as a release asset available with `wget ... | tar -xz`
  tutorial-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the tutorial tarball
        # `HEAD:docs/lessons` archives that directory as the root, so the lessons
        # unpack as `slurmise-tutorial/01_single_job/...` rather than carrying the
        # repo's own layout. Everything committed there is something a reader needs,
        # so nothing is filtered. If something ever has to be withheld, note that
        # `git archive` has no `--exclude` and silently ignores an exclude pathspec:
        # it takes a `.gitattributes` inside this directory, not a flag here.
        run: git archive --format=tar.gz --prefix=slurmise-tutorial/ -o slurmise-tutorial.tar.gz HEAD:docs/lessons

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" slurmise-tutorial.tar.gz --clobber
